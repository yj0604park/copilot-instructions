# Starship config — developer prompt
# Nerd Font 권장 (https://www.nerdfonts.com/)

format = """
$username in $hostname in $directory$git_branch$git_status$git_state$docker_context$python$nodejs$rust$golang$java$kotlin$swift$package$cmd_duration$jobs
$character"""

add_newline = true
command_timeout = 1000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[username]
show_always = true
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold cyan"
format = "[🌐 $hostname]($style) "

[directory]
truncation_length = 4
truncate_to_repo = false
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
disabled = false
style = "bold red"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "=${count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
deleted = "✘${count} "
format = "[$all_status$ahead_behind]($style)"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "took [$duration]($style) "

[jobs]
symbol = "✦ "
threshold = 1
format = "[$symbol$number]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
only_with_files = true

[python]
symbol = " "
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "

[rust]
symbol = " "
format = "[$symbol$version]($style) "

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[java]
symbol = " "
format = "[$symbol$version]($style) "

[kotlin]
symbol = " "
format = "[$symbol$version]($style) "

[swift]
symbol = " "
format = "[$symbol$version]($style) "

[package]
symbol = "📦 "
format = "[$symbol$version]($style) "
