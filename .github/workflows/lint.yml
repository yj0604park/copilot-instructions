name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d scripts\n' "${#files[@]}"
          shellcheck -S warning "${files[@]}"

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          exit $rc

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: compile check
        run: |
          mapfile -t files < <(git ls-files '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no python files"
            exit 0
          fi
          python -m py_compile "${files[@]}"
